name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}

  build-rions-installers:
    needs: run-flutter-tag-build
    # The upstream MSI job often fails (WiX $(var.Product)); that must not block us.
    # We only need the flutter Windows artifact, which uploads regardless.
    if: ${{ always() }}
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows x64 build
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: app
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
      - name: Inject unattended password
        shell: pwsh
        run: |
          $pw = "${{ secrets.RIONS_PASSWORD }}"
          if ([string]::IsNullOrEmpty($pw)) { Write-Error "RIONS_PASSWORD secret not set"; exit 1 }
          (Get-Content packaging/install-unattended.cmd) -replace '__RIONS_PASSWORD__', $pw | Set-Content packaging/install-unattended.cmd
      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          $out = "$env:GITHUB_WORKSPACE\out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($m in @("unattended","attended","controller")) {
            & $iscc "/DMode=$m" "/DAppDir=$env:GITHUB_WORKSPACE\app" "/DScripts=$env:GITHUB_WORKSPACE\packaging" "/O$out" "$env:GITHUB_WORKSPACE\packaging\installer.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for mode=$m" }
          }
          Get-ChildItem $out\*.exe
      - name: Attach installers to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*.exe